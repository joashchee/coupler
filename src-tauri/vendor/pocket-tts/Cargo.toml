# Pocket TTS's Candle port, vendored and trimmed by Coupler (README.md).
[package]
name = "pocket-tts"
version = "0.6.2"
edition = "2024"
authors = ["Pocket TTS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/babybirdprd/pocket-tts"
description = "Kyutai's Pocket TTS on Candle, CPU only, local files only, no voice cloning (Coupler's trimmed copy)"
publish = false

[dependencies]
anyhow = "1.0"
candle-core = "0.9.1"
candle-nn = "0.9.1"
rand = "0.8"
rand_distr = "0.4"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
# SentencePiece through the tokenizers crate. No default features: they
# bring Oniguruma (C), a progress bar and, with "http", a downloader.
tokenizers = { version = "0.21.0", default-features = false, features = ["fancy-regex"] }
tracing = "0.1"

